# The unit of the battery level reporting interval is seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# add keyboard debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Increase the transmission power of the keyboard's BLE radio to solve the issues of latency and poor left-right communication
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Modify the default keyboard display name
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# To fix errors related to battery reports in Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 디스플레이 활성화
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
# I2C 활성화
CONFIG_I2C=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y

#Bongo cat
#CONFIG_ZMK_WIDGET_BONGO_CAT=y

# 디스플레이가 충돌로 노이즈만 발생시키는 것을 방지하기 위함
# CONFIG_LVGL=y
# CONFIG_LV_TICK_CUSTOM=y


# Hibernation configuration
# Milliseconds of inactivity before entering idle state	(10 minute)
CONFIG_ZMK_IDLE_TIMEOUT=600000
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# rgb
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_WS2812_STRIP=n

# Disable RGB on idle
#CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
#CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
#CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# 로터리 엔코더 지원 활성화
# CONFIG_EC11=y
# 엔코더 처리를 위한 글로벌 스레드 사용 (입력 지연 방지)
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 포인팅 장치 지원 활성화 (예: 트랙볼, 터치패드 등), 스크롤 쓰려면 필수.
